{{define "content" -}}
{{with .Content -}}
<h1>{{.Heading}}</h1>
<p class="notice">{{.Message}}</p>
<table class="admin credentials">
  <tbody>
    <tr><th>Login</th><td><code>{{.Login}}</code></td></tr>
    <tr><th>Password</th><td><code>{{.Password}}</code></td></tr>
  </tbody>
</table>
<p><a class="button" href="{{.Continue}}">Done</a></p>
{{- end}}
{{- end}}
