name: Release

# Pushing a tag vX.Y.Z is the only way to publish. The tag runs the tests, pushes the image
# to GHCR, and creates the GitHub release with generated notes.
#   v1.2.3       -> image tags 1.2.3, 1.2, latest
#   v1.2.3-rc.1  -> image tag 1.2.3-rc.1 only; the release is marked as a pre-release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/thehackerdispatch
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Creates the release, or, if it already exists (made in the GitHub UI, or a re-run),
      # adds the image line to its notes without touching the rest.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          image_line="Container image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/thehackerdispatch:${TAG#v}\`"
          repo=(--repo "$GITHUB_REPOSITORY")
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true

          if body=$(gh release view "$TAG" "${repo[@]}" --json body --jq .body 2>/dev/null); then
            if [[ "$body" == *"$image_line"* ]]; then
              echo "Release $TAG already lists the image; nothing to do."
            else
              printf '%s\n\n%s\n' "$image_line" "$body" > notes.md
              gh release edit "$TAG" "${repo[@]}" --notes-file notes.md --prerelease="$prerelease"
              echo "Release $TAG already existed; added the image line."
            fi
          else
            gh release create "$TAG" "${repo[@]}" --verify-tag --generate-notes --title "$TAG" \
              --prerelease="$prerelease" --notes "$image_line"
          fi
