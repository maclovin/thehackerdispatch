{{define "content" -}}
{{with .Content -}}
<p class="meta"><a href="/s/{{.StoryID}}#c{{.Comment.ID}}">back to the discussion</a></p>
<h1>Edit comment</h1>
{{with .Error}}<p class="notice error" role="alert">{{.}}</p>{{end}}
<form class="stacked" method="post" action="/c/{{.Comment.ID}}/edit">
  <textarea name="body" required maxlength="5000" aria-label="Your comment" autofocus>{{.Body}}</textarea>
  <div class="buttons"><button class="primary" type="submit">Save</button>
    <span class="meta">Comments can be edited in the first 15 minutes.</span></div>
</form>
{{- end}}
{{- end}}
